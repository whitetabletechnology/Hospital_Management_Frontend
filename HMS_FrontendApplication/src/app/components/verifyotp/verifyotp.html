<div class="verify-otp-container">
  <h2>Verify OTP</h2>
<div class="success-message" *ngIf="message">
  {{ message }}
</div>

<!-- Error message -->
<div class="error-message" *ngIf="error">
  {{ error }}
</div>
  <form [formGroup]="verifyOtpForm" (ngSubmit)="onSubmit()">
    <div>
      <label>Enter OTP:</label>
      <input type="text" formControlName="otp" placeholder="Enter OTP" required />
    </div>
    <button type="submit" [disabled]="verifyOtpForm.invalid">Verify OTP</button>
  </form>
</div>
