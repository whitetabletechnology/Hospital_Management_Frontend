<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Doctors</h2>
    <button class="btn btn-primary" (click)="goToAddDoctor()">
      + Add Doctor
    </button>
  </div>

  <div *ngIf="doctors.length === 0" class="alert alert-warning text-center">
    No Doctors Found
  </div>

  <div class="table-responsive" *ngIf="doctors.length > 0">
    <table class="table table-bordered table-hover align-middle">

      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Specialization</th>
          <th>Contact</th>
          <th>Availability</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let doc of paginatedDoctors">
          <td>{{ doc.id }}</td>
          <td>{{ doc.user?.name }}</td>
          <td>{{ doc.user?.email }}</td>
          <td>{{ doc.specialization }}</td>
          <td>{{ doc.contactNumber }}</td>
          <td>{{ doc.availability }}</td>
          <td class="text-center">
            <button
              class="btn btn-sm btn-warning me-2"
              (click)="editDoctor(doc.id)">
              Edit
            </button>
            <button
              class="btn btn-sm btn-danger"
              (click)="deleteDoctor(doc.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- Pagination -->
<div class="pagination-container" *ngIf="totalPages > 1">

  <button class="page-btn"
          [disabled]="currentPage === 1"
          (click)="previousPage()">Previous</button>

  <button *ngFor="let p of [].constructor(totalPages); let i = index"
          class="page-btn"
          [class.active]="currentPage === i + 1"
          (click)="setPage(i + 1)">
    {{ i + 1 }}
  </button>

  <button class="page-btn"
          [disabled]="currentPage === totalPages"
          (click)="nextPage()">Next</button>

</div>

  </div>
</div>
