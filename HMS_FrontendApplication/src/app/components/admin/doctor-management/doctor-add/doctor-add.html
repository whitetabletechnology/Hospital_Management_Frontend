<div class="container">
  <h2>Add New Doctor</h2>

  <form [formGroup]="doctorForm" (ngSubmit)="submitForm()">

    <!-- USER DETAILS -->
    <div class="section-title">User Details</div>

    <div formGroupName="user">

      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password">
      </div>

    </div>

    <!-- DOCTOR DETAILS -->
    <div class="section-title">Doctor Details</div>

    <div class="form-group">
      <label>Specialization</label>
      <input type="text" formControlName="specialization">
    </div>

    <div class="form-group">
      <label>Contact Number</label>
      <input type="text" formControlName="contactNumber">
    </div>

    <div class="form-group">
      <label>Availability</label>
      <input type="text" formControlName="availability">
      
    </div>

    <button type="submit" class="submit-btn">Add Doctor</button>

  </form>
</div>
